version: 2
updates:
  # Chaperone's own runtime/dev dependencies (improvement_plan.md 4.6) —
  # slightly ironic for a security scanner not to audit itself.
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    groups:
      dev-dependencies:
        dependency-type: 'development'
    ignore:
      # typescript 7 isn't supported by @typescript-eslint 8.70 yet (its own
      # PR's CI run failed on this, see DECISIONS.md, Phase 8). Ignoring the
      # major-version bump only; patch/minor still flow through. Remove once
      # typescript-eslint ships TS7 support. (vitest 5 was also ignored
      # until the Node floor moved from 20 to 22, PROPOSED_FIXES.md 7.1.)
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      # vitest 5 silently breaks mutation testing: @stryker-mutator/vitest-runner
      # 10.0.0 (latest as of 2026-10-04) runs but kills almost no mutants
      # under vitest 5 (overall score 69.9% -> 11.5%, gitignoreMatch.ts
      # 81% -> 0%), and the mutation job is configured never to fail on
      # score, so CI stays green. Remove once a Stryker vitest runner
      # supports vitest 5 (check: npm run mutation scores match vitest 4).
      - dependency-name: 'vitest'
        update-types: ['version-update:semver-major']
      - dependency-name: '@vitest/coverage-v8'
        update-types: ['version-update:semver-major']

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
