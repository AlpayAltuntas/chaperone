name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format
      - run: npm run typecheck
      - run: npm run typecheck:tests
      # Chaperone auditing its own dependencies (improvement_plan.md 4.6).
      - run: npm audit --audit-level=high
      - run: npm run build
      # CHECKS.md is generated from the ALL_CHECKS registry
      # (improvement_plan.md 4.2) — fails if someone hand-edits CHECKS.md
      # or adds/changes a check without running `npm run docs:checks`.
      - run: npm run docs:checks:check

      # The one check that would have caught the real symlink-entrypoint
      # bug (see DECISIONS.md, "Post-v1 — npm publish prep"): npm test
      # alone never exercises the actual packaged/installed binary.
      # improvement_plan.md 4.4 — this was a manual pre-publish step
      # before; now it runs on every push/PR.
      - name: Verify the packaged binary works (npm pack -> install -> run)
        run: |
          set -e
          npm pack
          PACK_DIR="$(mktemp -d)"
          cp ./*.tgz "$PACK_DIR/chaperone.tgz"
          cd "$PACK_DIR"
          npm init -y > /dev/null
          npm install ./chaperone.tgz
          VERSION_OUTPUT="$(node node_modules/.bin/chaperone --version)"
          echo "Reported version: $VERSION_OUTPUT"
          if [ -z "$VERSION_OUTPUT" ]; then
            echo "::error::chaperone --version printed nothing — this is exactly the symlink-entrypoint bug this check exists to catch"
            exit 1
          fi
          node node_modules/.bin/chaperone checks | grep -q "CHAP-SEC-001"
          node node_modules/.bin/chaperone scan "$GITHUB_WORKSPACE/test/fixtures/clean-agent" --no-color

      - run: npm run test:coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
