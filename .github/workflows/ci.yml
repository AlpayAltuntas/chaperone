name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # The `engines` floor. Node 20 reached end-of-life on 2026-04-30
          # (PROPOSED_FIXES.md 7.1).
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format
      - run: npm run typecheck
      - run: npm run typecheck:tests
      # Chaperone auditing its own dependencies (improvement_plan.md 4.6).
      - run: npm audit --audit-level=high
      - run: npm run build
      # CHECKS.md is generated from the ALL_CHECKS registry
      # (improvement_plan.md 4.2) — fails if someone hand-edits CHECKS.md
      # or adds/changes a check without running `npm run docs:checks`.
      - run: npm run docs:checks:check

      # The one check that would have caught the real symlink-entrypoint
      # bug (see DECISIONS.md, "Post-v1 — npm publish prep"): npm test
      # alone never exercises the actual packaged/installed binary.
      # improvement_plan.md 4.4 — this was a manual pre-publish step
      # before; now it runs on every push/PR.
      - name: Verify the packaged binary works (npm pack -> install -> run)
        run: |
          set -e
          npm pack
          PACK_DIR="$(mktemp -d)"
          cp ./*.tgz "$PACK_DIR/chaperone.tgz"
          cd "$PACK_DIR"
          npm init -y > /dev/null
          npm install ./chaperone.tgz
          VERSION_OUTPUT="$(node node_modules/.bin/chaperone --version)"
          echo "Reported version: $VERSION_OUTPUT"
          if [ -z "$VERSION_OUTPUT" ]; then
            echo "::error::chaperone --version printed nothing — this is exactly the symlink-entrypoint bug this check exists to catch"
            exit 1
          fi
          node node_modules/.bin/chaperone checks | grep -q "CHAP-SEC-001"
          node node_modules/.bin/chaperone scan "$GITHUB_WORKSPACE/test/fixtures/clean-agent" --no-color

      - run: npm run test:coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  # The test suite on more platforms and Node versions (PROPOSED_FIXES.md
  # 7.2): permission checks, path handling (expandHome, pathToFileURL), and
  # --docker are platform-sensitive. build-lint-test above already covers
  # Node 22 on Linux.
  test-matrix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 24
          - os: macos-latest
            node: 22
          - os: windows-latest
            node: 22
            # Non-blocking for now: many tests assert POSIX permission
            # findings (CHAP-SEC-003/006/008, CHAP-OBS-004), which by design
            # report as unknown on Windows. Porting those tests to assert
            # the Windows behavior is tracked in PROPOSED_FIXES.md 7.2.
            experimental: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental == true }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  # Mutation testing (improvement_plan.md 5.4) — a non-blocking "tests
  # for the test suite" signal, deliberately: a separate job, not a step
  # in build-lint-test, and not listed in this repo's required status
  # checks, so it can never block a merge regardless of outcome.
  # stryker.config.mjs's own thresholds.break is also explicitly `null`
  # (mutation score alone never fails the `stryker run` process) — a job
  # failure here means Stryker itself errored, not a low score.
  # Deliberately scoped to a small, fast subset of the codebase (see
  # stryker.config.mjs) rather than the whole src/ tree, which would be
  # too slow for a per-push signal.
  mutation-testing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run mutation
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 14
